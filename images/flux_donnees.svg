<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 580" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a13"/>
      <stop offset="50%" stop-color="#0c1322"/>
      <stop offset="100%" stop-color="#060910"/>
    </linearGradient>

    <!-- Ambient Glows -->
    <radialGradient id="glowMoto" cx="15%" cy="30%" r="35%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowCloud" cx="42%" cy="30%" r="35%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowLaptop" cx="72%" cy="30%" r="38%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowExport" cx="93%" cy="30%" r="35%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>

    <!-- Card Background -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141d30" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0c1220" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Clip Path for Laptop Screen -->
    <clipPath id="screenClip">
      <rect x="0" y="0" width="220" height="138" rx="6"/>
    </clipPath>

    <!-- Drop Shadows -->
    <filter id="shadowBox" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity="0.6"/>
    </filter>
    <filter id="neonGlowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#38bdf8" flood-opacity="0.8"/>
    </filter>
    <filter id="neonGlowAmber" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#f59e0b" flood-opacity="0.8"/>
    </filter>
    <filter id="neonGlowGreen" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#10b981" flood-opacity="0.8"/>
    </filter>

    <!-- Arrow Marker -->
    <marker id="arrowHead" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <polygon points="0 0, 7 2.5, 0 5" fill="#64748b" />
    </marker>
  </defs>

  <style>
    .title { font-family: 'Inter', system-ui, sans-serif; font-weight: 800; fill: #ffffff; font-size: 21px; letter-spacing: -0.5px; }
    .subtitle { font-family: 'Inter', system-ui, sans-serif; font-weight: 500; fill: #94a3b8; font-size: 13px; }
    .stage-title { font-family: 'Inter', system-ui, sans-serif; font-weight: 700; font-size: 13px; letter-spacing: 0.5px; text-transform: uppercase; }
    .badge-hdr { font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 10px; }
    .pill-text { font-family: 'JetBrains Mono', monospace; font-size: 9.5px; font-weight: 600; }
    .spec-label { font-family: 'Inter', system-ui, sans-serif; font-weight: 600; font-size: 11px; fill: #f1f5f9; }
    .spec-desc { font-family: 'Inter', system-ui, sans-serif; font-weight: 400; font-size: 10.5px; fill: #94a3b8; }
    .arrow-text { font-family: 'Inter', system-ui, sans-serif; font-weight: 700; font-size: 9.5px; text-anchor: middle; }
    .code-box { font-family: 'JetBrains Mono', monospace; font-size: 8.5px; fill: #fbbf24; }
  </style>

  <!-- Deep Background & Glows -->
  <rect width="1200" height="580" fill="url(#bgGrad)"/>
  <rect width="1200" height="580" fill="url(#glowMoto)"/>
  <rect width="1200" height="580" fill="url(#glowCloud)"/>
  <rect width="1200" height="580" fill="url(#glowLaptop)"/>
  <rect width="1200" height="580" fill="url(#glowExport)"/>

  <!-- ==================== HEADER ==================== -->
  <g transform="translate(50, 42)">
    <text class="title" x="0" y="0">🏍️ Architecture &amp; Cheminement des Données en Temps Réel</text>
    <text class="subtitle" x="0" y="24">Flux 100% Client-Direct : De la moto jusqu'à l'export GPX sans aucun serveur tiers intermédiaire</text>
    
    <!-- Top Guarantee Pill -->
    <g transform="translate(860, -10)">
      <rect width="240" height="30" rx="15" fill="#10b981" fill-opacity="0.12" stroke="#10b981" stroke-width="1.2"/>
      <circle cx="16" cy="15" r="4" fill="#10b981"/>
      <text class="badge-hdr" x="28" y="19" fill="#10b981">GARANTIE 100% LOCAL &amp; PRIVÉ</text>
    </g>
  </g>

  <!-- ==================== STEP 1 : MOTO & CAPTEURS ==================== -->
  <!-- Visual Illustration (Moto) -->
  <g transform="translate(60, 95)">
    <!-- Moto Canvas Background Circle -->
    <circle cx="95" cy="80" r="72" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.4"/>
    
    <!-- Sports Motorcycle Silhouette (Vector Path) -->
    <g transform="translate(35, 38)" stroke="#38bdf8" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <!-- Front Wheel -->
      <circle cx="95" cy="62" r="18" stroke-width="2.5" fill="#0b1322"/>
      <circle cx="95" cy="62" r="12" stroke-width="1" stroke-dasharray="2 3"/>
      <!-- Rear Wheel -->
      <circle cx="22" cy="62" r="18" stroke-width="2.5" fill="#0b1322"/>
      <circle cx="22" cy="62" r="12" stroke-width="1" stroke-dasharray="2 3"/>
      <!-- Swingarm & Frame -->
      <path d="M22 62 L48 50 L56 38 L84 32 L95 62" stroke-width="2.5"/>
      <!-- Engine Block Area -->
      <path d="M42 52 L62 52 L58 64 L42 62 Z" fill="#1e293b" stroke-width="1.5"/>
      <!-- Tank, Fairing & Windshield -->
      <path d="M48 38 C52 26 66 22 75 28 L92 30 L85 20 L76 22" stroke-width="2.5" fill="#0284c7" fill-opacity="0.25"/>
      <!-- Headlight Beam -->
      <polygon points="92,30 115,22 115,38" fill="#38bdf8" fill-opacity="0.25" stroke="none"/>
      <!-- Seat & Tail Section -->
      <path d="M30 35 L48 38 L45 44 L25 40 Z" stroke-width="2" fill="#0284c7" fill-opacity="0.4"/>
      <!-- Exhaust Pipe -->
      <path d="M52 58 L30 54" stroke-width="2" stroke="#94a3b8"/>
    </g>

    <!-- Glowing GPS Tracker Unit over the Seat -->
    <g transform="translate(68, 55)" filter="url(#neonGlowCyan)">
      <rect x="0" y="0" width="22" height="15" rx="3" fill="#0284c7" stroke="#38bdf8" stroke-width="1.5"/>
      <!-- Blinking Satellite Antenna Wave -->
      <path d="M-4 -3 C6 -10 16 -10 26 -3" stroke="#38bdf8" stroke-width="1.8" fill="none" stroke-linecap="round"/>
      <path d="M-8 -8 C6 -18 16 -18 30 -8" stroke="#38bdf8" stroke-width="1.2" fill="none" stroke-dasharray="2 2"/>
      <circle cx="11" cy="7.5" r="2.5" fill="#ffffff"/>
    </g>
  </g>

  <!-- Technical Card 1 (Under Moto) -->
  <g transform="translate(40, 275)" filter="url(#shadowBox)">
    <rect width="230" height="215" rx="10" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.7"/>
    <rect width="230" height="34" rx="10" fill="#38bdf8" fill-opacity="0.12"/>
    <text class="stage-title" x="15" y="22" fill="#38bdf8">1. MOTO &amp; CAPTEURS</text>
    
    <g transform="translate(15, 52)">
      <text class="spec-label" x="0" y="0">Boîtier Pégase / Flashbird</text>
      <text class="spec-desc" x="0" y="16">• Branché sur batterie 12V</text>

      <text class="spec-label" x="0" y="40">GPS Haute Précision 10 Hz</text>
      <text class="spec-desc" x="0" y="56">• 10 coordonnées / seconde (lat, lon, cap)</text>

      <text class="spec-label" x="0" y="80">Accéléromètre 3D &amp; Gyroscope</text>
      <text class="spec-desc" x="0" y="96">• Freinages (G), Relances, Angle D/G</text>

      <rect x="0" y="115" width="200" height="24" rx="5" fill="#38bdf8" fill-opacity="0.1" stroke="#38bdf8" stroke-width="0.8"/>
      <text class="pill-text" x="100" y="131" fill="#38bdf8" text-anchor="middle">📡 SIM Multi-Opérateurs 2G / 4G</text>
    </g>
  </g>

  <!-- ==================== ARROW 1 -> 2 ==================== -->
  <g transform="translate(270, 260)">
    <line x1="8" y1="-80" x2="62" y2="-80" stroke="#38bdf8" stroke-width="2.5" stroke-dasharray="4 3"/>
    <polygon points="62,-84 70,-80 62,-76" fill="#38bdf8"/>
    
    <rect x="5" y="-105" width="68" height="18" rx="4" fill="#0f172a" stroke="#38bdf8" stroke-width="0.8"/>
    <text class="arrow-text" x="39" y="-93" fill="#38bdf8">Réseau GSM</text>
  </g>

  <!-- ==================== STEP 2 : CLOUD SMT PERFORMANCES ==================== -->
  <!-- Visual Illustration (Cloud & Secure Server) -->
  <g transform="translate(365, 95)">
    <!-- Canvas Circle -->
    <circle cx="95" cy="80" r="72" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5" stroke-opacity="0.4"/>
    
    <!-- 3D Cloud Graphic with Server Stack -->
    <g transform="translate(42, 38)">
      <!-- Server Base Racks -->
      <rect x="22" y="58" width="64" height="16" rx="4" fill="#1e293b" stroke="#f59e0b" stroke-width="1.2"/>
      <circle cx="32" cy="66" r="2.5" fill="#10b981"/>
      <circle cx="40" cy="66" r="2.5" fill="#38bdf8"/>
      <line x1="52" y1="66" x2="78" y2="66" stroke="#475569" stroke-width="1.5"/>

      <rect x="18" y="44" width="72" height="16" rx="4" fill="#1e293b" stroke="#f59e0b" stroke-width="1.2"/>
      <circle cx="28" cy="52" r="2.5" fill="#10b981"/>
      <circle cx="36" cy="52" r="2.5" fill="#fbbf24"/>
      <line x1="48" y1="52" x2="82" y2="52" stroke="#475569" stroke-width="1.5"/>

      <!-- Cloud Outline Shape -->
      <path d="M30 46 C20 46 12 38 14 28 C14 20 22 14 30 16 C34 8 46 6 56 12 C64 6 78 8 82 18 C90 18 96 26 94 34 C94 42 86 46 78 46 Z" 
            fill="#d97706" fill-opacity="0.2" stroke="#f59e0b" stroke-width="2.2" stroke-linejoin="round"/>
      
      <!-- Glowing Padlock (Security) -->
      <g transform="translate(45, 18)" filter="url(#neonGlowAmber)">
        <rect x="0" y="8" width="18" height="14" rx="3" fill="#f59e0b"/>
        <path d="M4 8 L4 4 C4 1.5 14 1.5 14 4 L14 8" fill="none" stroke="#f59e0b" stroke-width="2.2" stroke-linecap="round"/>
        <circle cx="9" cy="14" r="2" fill="#0f172a"/>
      </g>
    </g>
  </g>

  <!-- Technical Card 2 (Under Cloud) -->
  <g transform="translate(345, 275)" filter="url(#shadowBox)">
    <rect width="240" height="215" rx="10" fill="url(#cardGrad)" stroke="#f59e0b" stroke-width="1.2" stroke-opacity="0.7"/>
    <rect width="240" height="34" rx="10" fill="#f59e0b" fill-opacity="0.12"/>
    <text class="stage-title" x="15" y="22" fill="#f59e0b">2. SERVEUR OFFICIEL SMT</text>
    
    <g transform="translate(15, 52)">
      <text class="spec-label" x="0" y="0">Fabricant : SMT Performances SAS</text>
      <text class="spec-desc" x="0" y="16">• Hébergement sécurisé en France</text>

      <text class="spec-label" x="0" y="38">Adresse API Officielle (GraphQL) :</text>
      <rect x="0" y="46" width="210" height="22" rx="4" fill="#090e17" stroke="#f59e0b" stroke-width="0.8"/>
      <text class="code-box" x="6" y="60">https://pegase.api-smt.ovh/graphql</text>

      <text class="spec-label" x="0" y="88">Chiffrement &amp; Sécurité :</text>
      <text class="spec-desc" x="0" y="104">• TLS 1.3 / HTTPS (Chiffrement SSL bancaire)</text>

      <rect x="0" y="115" width="210" height="24" rx="5" fill="#f59e0b" fill-opacity="0.1" stroke="#f59e0b" stroke-width="0.8"/>
      <text class="pill-text" x="105" y="131" fill="#f59e0b" text-anchor="middle">🔒 Données Brutes Chiffrées</text>
    </g>
  </g>

  <!-- ==================== ARROW 2 -> 3 ==================== -->
  <g transform="translate(585, 260)">
    <line x1="8" y1="-80" x2="62" y2="-80" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="4 3"/>
    <polygon points="62,-84 70,-80 62,-76" fill="#f59e0b"/>

    <rect x="2" y="-105" width="76" height="18" rx="4" fill="#0f172a" stroke="#f59e0b" stroke-width="0.8"/>
    <text class="arrow-text" x="40" y="-93" fill="#f59e0b">HTTPS Direct</text>
  </g>

  <!-- ==================== STEP 3 : PEGASE GPX STUDIO (LOCAL PC) ==================== -->
  <!-- Visual Illustration (Laptop with Real Screenshot) -->
  <g transform="translate(660, 80)">
    <!-- Modern Laptop Mockup Frame -->
    <!-- Screen Shell Lid -->
    <rect x="18" y="10" width="236" height="154" rx="10" fill="#0f172a" stroke="#334155" stroke-width="2.5"/>
    <circle cx="136" cy="18" r="2" fill="#475569"/> <!-- Webcam -->

    <!-- Embedded Real Application Screenshot inside Screen -->
    <g transform="translate(26, 22)">
      <image href="cockpit_carte.png" width="220" height="138" preserveAspectRatio="xMidYMid slice" clip-path="url(#screenClip)"/>
      <!-- Subtle Screen Gloss Overlay -->
      <rect width="220" height="138" rx="6" fill="#10b981" fill-opacity="0.04" stroke="#10b981" stroke-width="1"/>
    </g>

    <!-- Laptop Base / Keyboard Deck -->
    <polygon points="6,164 266,164 282,176 -10,176" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
    <rect x="110" y="165" width="52" height="4" rx="2" fill="#0f172a"/> <!-- Display Hinge Notch -->
    <rect x="105" y="169" width="62" height="5" rx="1.5" fill="#334155"/> <!-- Trackpad Indent -->
    
    <!-- Neon Underglow -->
    <line x1="10" y1="177" x2="262" y2="177" stroke="#10b981" stroke-width="3" filter="url(#neonGlowGreen)"/>
  </g>

  <!-- Technical Card 3 (Under Laptop) -->
  <g transform="translate(655, 275)" filter="url(#shadowBox)">
    <rect width="265" height="215" rx="10" fill="url(#cardGrad)" stroke="#10b981" stroke-width="1.6"/>
    <rect width="265" height="34" rx="10" fill="#10b981" fill-opacity="0.14"/>
    <text class="stage-title" x="15" y="22" fill="#10b981">3. VOTRE PC (PÉGASE STUDIO)</text>
    
    <g transform="translate(15, 52)">
      <text class="spec-label" x="0" y="0">Connexion Client Directe :</text>
      <text class="spec-desc" x="0" y="15">• POST login(user, pass) ➔ Jeton JWT local</text>

      <text class="spec-label" x="0" y="38">Base Locale sur Disque (localStorage) :</text>
      <text class="spec-desc" x="0" y="53">• Démarrage instantané (0 ms) &amp; synchro incrémentale</text>

      <text class="spec-label" x="0" y="76">Moteur de Calcul Local (utils.js) :</text>
      <text class="spec-desc" x="0" y="91">• Calcul vitesse de pointe, décélération (G) &amp; angles</text>

      <rect x="0" y="115" width="235" height="24" rx="5" fill="#10b981" fill-opacity="0.12" stroke="#10b981" stroke-width="0.8"/>
      <text class="pill-text" x="117" y="131" fill="#10b981" text-anchor="middle">🛡️ 100% NAVIGATEUR (ZÉRO SERVEUR TIERS)</text>
    </g>
  </g>

  <!-- ==================== ARROW 3 -> 4 ==================== -->
  <g transform="translate(920, 260)">
    <line x1="8" y1="-80" x2="52" y2="-80" stroke="#10b981" stroke-width="2.5" stroke-dasharray="4 3"/>
    <polygon points="52,-84 60,-80 52,-76" fill="#10b981"/>

    <rect x="2" y="-105" width="64" height="18" rx="4" fill="#0f172a" stroke="#10b981" stroke-width="0.8"/>
    <text class="arrow-text" x="34" y="-93" fill="#10b981">Export GPX</text>
  </g>

  <!-- ==================== STEP 4 : EXPORT GPX & VIDÉO ==================== -->
  <!-- Visual Illustration (GPX Document & Action Cam) -->
  <g transform="translate(995, 95)">
    <!-- Canvas Circle -->
    <circle cx="85" cy="80" r="72" fill="#0f172a" stroke="#a855f7" stroke-width="1.5" stroke-opacity="0.4"/>
    
    <g transform="translate(48, 35)">
      <!-- 3D Document Sheet -->
      <polygon points="0,0 52,0 70,18 70,88 0,88" fill="#1e293b" stroke="#a855f7" stroke-width="2"/>
      <polygon points="52,0 52,18 70,18" fill="#a855f7" fill-opacity="0.4" stroke="#a855f7" stroke-width="1.5"/>

      <!-- GPX Badge on Document -->
      <rect x="10" y="24" width="50" height="20" rx="4" fill="#a855f7"/>
      <text x="35" y="38" font-family="'JetBrains Mono', monospace" font-weight="800" font-size="12" fill="#ffffff" text-anchor="middle">GPX</text>

      <!-- Waveform / Track Preview lines -->
      <path d="M12 58 L24 52 L36 66 L48 54 L58 60" stroke="#38bdf8" stroke-width="2" fill="none" stroke-linecap="round"/>
      <circle cx="36" cy="66" r="2.5" fill="#fbbf24"/>

      <!-- Action Cam / Video Clapper Overlay -->
      <g transform="translate(42, 60)">
        <circle cx="16" cy="16" r="16" fill="#090d16" stroke="#fbbf24" stroke-width="1.5"/>
        <polygon points="12,9 24,16 12,23" fill="#fbbf24"/>
      </g>
    </g>
  </g>

  <!-- Technical Card 4 (Under Export) -->
  <g transform="translate(975, 275)" filter="url(#shadowBox)">
    <rect width="185" height="215" rx="10" fill="url(#cardGrad)" stroke="#a855f7" stroke-width="1.2" stroke-opacity="0.7"/>
    <rect width="185" height="34" rx="10" fill="#a855f7" fill-opacity="0.12"/>
    <text class="stage-title" x="15" y="22" fill="#a855f7">4. EXPORT &amp; VIDÉO</text>
    
    <g transform="translate(15, 52)">
      <text class="spec-label" x="0" y="0">Format GPX 1.1 Enrichi :</text>
      <text class="spec-desc" x="0" y="15">• &lt;speed&gt;, &lt;tilt&gt;, &lt;gforce&gt;</text>
      <text class="spec-desc" x="0" y="30">• Balises XML standardisées</text>

      <text class="spec-label" x="0" y="54">Archives .ZIP en masse :</text>
      <text class="spec-desc" x="0" y="69">• Compression JSZip intégrée</text>

      <text class="spec-label" x="0" y="93">Incrustation Vidéo :</text>
      <text class="spec-desc" x="0" y="108">• VIRB Edit, DashWare, RaceRender</text>

      <rect x="0" y="115" width="155" height="24" rx="5" fill="#a855f7" fill-opacity="0.1" stroke="#a855f7" stroke-width="0.8"/>
      <text class="pill-text" x="77" y="131" fill="#a855f7" text-anchor="middle">💾 Dossier Téléchargements</text>
    </g>
  </g>

  <!-- ==================== BOTTOM FOOTER BANNER ==================== -->
  <g transform="translate(50, 520)">
    <rect width="1100" height="32" rx="8" fill="#0b1120" stroke="#1e293b" stroke-width="1.2"/>
    <circle cx="20" cy="16" r="4" fill="#10b981"/>
    <text class="spec-desc" x="32" y="20" font-size="11" fill="#cbd5e1">
      <tspan fill="#10b981" font-weight="700">CONFIDENTIALITÉ GARANTIE :</tspan> Vos identifiants et traces GPS sont échangés exclusivement entre votre navigateur et le serveur officiel SMT Performances. Aucun intermédiaire tiers.
    </text>
  </g>
</svg>
